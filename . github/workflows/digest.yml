name: Daily AI Digest Website

on:
  schedule:
    - cron: '0 7 * * *' # Fires every day at 7:00 AM UTC
  workflow_dispatch: # This line unlocks the manual button under the Actions tab

permissions:
  contents: write # Gives the GitHub bot permission to update your index.md file

jobs:
  build-and-run:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repo
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        pip install feedparser google-genai requests beautifulsoup4

    - name: Run Digest Script
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: python digest.py

    - name: Commit and Push Changes
      run: |
        git config --global user.name "GitHub Actions Bot"
        git config --global user.email "actions@github.com"
        git add index.md
        git commit -m "Update Daily Digest Website" || echo "No changes to commit"
        git push
